<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday Mrs. Frieboth</title>
  <meta name="theme-color" content="#0e0609">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screen1.css">
  <link rel="stylesheet" href="css/screen2.css">
  <link rel="stylesheet" href="css/player.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>

  <canvas id="embers" aria-hidden="true"></canvas>

  <!-- SCREEN 1 -->
  <section class="s1" id="screen1">
    <div class="s1__inner">
      <div class="s1__top">
        <span class="s1__from">from two crews &mdash; 2026</span>
      </div>
      <div class="s1__center">
        <p class="s1__pre">happy birthday</p>
        <h1 class="s1__name">Mrs.<br>Frieboth</h1>
        <p class="s1__sub">We made something for you.</p>
      </div>
      <div class="s1__bottom">
        <button class="s1__btn" id="enter-btn" type="button">
          <span>Watch the reels</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 2v11M3 9l5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="s1__hint">turn your sound on</p>
      </div>
    </div>
  </section>

  <!-- SCREEN 2 -->
  <section class="s2" id="screen2" aria-hidden="true">
    <div class="s2__layout">

      <!-- Left: player area -->
      <div class="s2__player" id="player-area">

        <!-- Candle lock screen (shown until a candle is clicked) -->
        <div class="candle-stage" id="candle-stage">
          <p class="candle-stage__hint">click a candle to unlock a reel</p>
          <div class="candle-row" id="candle-row"></div>
        </div>

        <!-- Video player (hidden until a video reel is selected) -->
        <div class="screen" id="screen" data-state="idle" style="display:none">
          <video class="screen__main" id="video-main" playsinline preload="metadata"></video>
          <button class="screen__big" id="big-play" type="button" aria-label="Play">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <path d="M6 4.5v15l13-7.5-13-7.5z" fill="currentColor"/>
            </svg>
          </button>
          <div class="screen__msg" id="screen-msg" role="status">
            <p>Video not found.</p>
          </div>
          <div class="screen__caption">
            <span class="screen__tag" id="reel-group"></span>
            <strong id="reel-name"></strong>
          </div>
          <div class="controls" id="controls">
            <button class="ctl" id="ctl-play" type="button" aria-label="Play">
              <svg class="i-play" viewBox="0 0 24 24" width="18" height="18"><path d="M7 4.5v15l13-7.5-13-7.5z" fill="currentColor"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" width="18" height="18"><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z" fill="currentColor"/></svg>
            </button>
            <span class="time" id="time-cur">0:00</span>
            <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
            <span class="time" id="time-dur">0:00</span>
            <button class="ctl" id="ctl-mute" type="button" aria-label="Mute">
              <svg class="i-vol" viewBox="0 0 24 24" width="18" height="18"><path d="M4 9.5v5h4l5 4v-13l-5 4H4z" fill="currentColor"/><path d="M16 8.5c1.6 1.2 1.6 5.8 0 7M18.5 6c3 2.6 3 9.4 0 12" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
              <svg class="i-mute" viewBox="0 0 24 24" width="18" height="18"><path d="M4 9.5v5h4l5 4v-13l-5 4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <button class="ctl" id="ctl-full" type="button" aria-label="Fullscreen">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="square"/></svg>
            </button>
          </div>
        </div>

        <!-- Audio player (hidden until an audio reel is selected) -->
        <div class="audio-player" id="audio-player" style="display:none">
          <div class="audio-player__inner">
            <div class="audio-player__label">
              <span class="audio-player__tag" id="audio-group"></span>
              <strong class="audio-player__name" id="audio-name"></strong>
            </div>
            <div class="audio-player__wave" id="audio-wave">
              <canvas id="wave-canvas"></canvas>
            </div>
            <div class="audio-player__controls">
              <button class="ctl" id="a-ctl-play" type="button" aria-label="Play">
                <svg class="i-play" viewBox="0 0 24 24" width="22" height="22"><path d="M7 4.5v15l13-7.5-13-7.5z" fill="currentColor"/></svg>
                <svg class="i-pause" viewBox="0 0 24 24" width="22" height="22"><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z" fill="currentColor"/></svg>
              </button>
              <span class="time" id="a-time-cur">0:00</span>
              <input class="scrub" id="a-scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
              <span class="time" id="a-time-dur">0:00</span>
              <button class="ctl" id="a-ctl-mute" type="button" aria-label="Mute">
                <svg class="i-vol" viewBox="0 0 24 24" width="18" height="18"><path d="M4 9.5v5h4l5 4v-13l-5 4H4z" fill="currentColor"/><path d="M16 8.5c1.6 1.2 1.6 5.8 0 7M18.5 6c3 2.6 3 9.4 0 12" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
                <svg class="i-mute" viewBox="0 0 24 24" width="18" height="18"><path d="M4 9.5v5h4l5 4v-13l-5 4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>
        </div>

      </div>

      <!-- Right: sidebar -->
      <div class="s2__side">
        <div class="s2__header">
          <button class="s2__back" id="back-btn" type="button" aria-label="Back">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div>
            <p class="s2__title">Mrs. Frieboth</p>
            <p class="s2__status" id="reel-status">0 of 5 lit</p>
          </div>
          <div class="s2__candles" id="reel-candles"></div>
        </div>

        <div class="s2__queue" id="queue"></div>

        <div class="s2__wish" id="wish" aria-live="polite"></div>
      </div>

    </div>
  </section>

</body>
</html>
